# RoboCasa Panda atomic eval for pi0.5.
# This harness image registers classic short names (24 atomic tasks), not the
# RoboCasa365 long-name target50 set (PickPlaceCounterToCabinet, …).
# 50 episodes/task (full Panda atomic convention).
server:
  url: "ws://localhost:8004"
  timeout: 120.0

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/robocasa:latest
  gpus: "0,1,4"

output_dir: "./results_robocasa_pi05"

benchmarks:
  - benchmark: "vla_eval.benchmarks.robocasa.benchmark:RoboCasaBenchmark"
    episodes_per_task: 50
    params:
      robot: PandaOmron
      camera_size: 256
      max_steps: 500
      split: pretrain
      seed: 0
      action_dim: 12
      tasks:
        # Pick-and-place (8)
        - PnPCounterToCab
        - PnPCounterToSink
        - PnPCounterToMicrowave
        - PnPCounterToStove
        - PnPCabToCounter
        - PnPSinkToCounter
        - PnPMicrowaveToCounter
        - PnPStoveToCounter
        # Doors / drawers (6)
        - OpenSingleDoor
        - OpenDoubleDoor
        - CloseSingleDoor
        - CloseDoubleDoor
        - OpenDrawer
        - CloseDrawer
        # Twists / levers / buttons (7)
        - TurnOnSinkFaucet
        - TurnOffSinkFaucet
        - TurnSinkSpout
        - TurnOnStove
        - TurnOffStove
        - TurnOnMicrowave
        - TurnOffMicrowave
        # Coffee (3)
        - CoffeeSetupMug
        - CoffeeServeMug
        - CoffeePressButton
