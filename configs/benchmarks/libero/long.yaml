# LIBERO-90 suite (90 tasks × 50 episodes)
server:
  url: "ws://localhost:8002"
  timeout: 120.0

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest
  gpus: "0,1,2,3,4,5,6"

output_dir: "./results_libero_long"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    episodes_per_task: 50
    params:
      suite: libero_90
      seed: 7
      num_steps_wait: 10

