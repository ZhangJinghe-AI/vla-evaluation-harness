# LIBERO Goal — model server on :8004, shards → ./results_4
# Pair with: configs/model_servers/phyai/groot_n17/libero.yaml
server:
  url: "ws://localhost:8006"
  timeout: 120.0

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest
  gpus: "0,1,4"

output_dir: "./results_6"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    subname: libero_goal
    episodes_per_task: 50
    params:
      suite: libero_goal
      seed: 7
      num_steps_wait: 10
