# LIBERO Object — model server on :8004, shards → ./results_4
# Pair with: configs/model_servers/phyai/pi05/libero.yaml
server:
  url: "ws://localhost:8004"
  timeout: 120.0

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest
  gpus: "0,1,2,3,4"

output_dir: "./results_object_4"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    subname: libero_object
    episodes_per_task: 50
    params:
      suite: libero_object
      seed: 7
      num_steps_wait: 10
      # max_steps: 400
