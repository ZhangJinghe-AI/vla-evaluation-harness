# LIBERO Object suite (10 tasks × 50 episodes)
server:
  url: "ws://localhost:8002"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest
  gpus: "1,4,5"

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    subname: libero_object
    episodes_per_task: 50
    params:
      suite: libero_object
      seed: 7
      num_steps_wait: 10
      # max_steps: 400

