# Minimal smoke test: 1 task, 1 episode
server:
  url: "ws://localhost:8001"
  timeout: 120.0

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest
  gpus: "0,1,2,3,4"

output_dir: "./results_libero_smoke_test"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    episodes_per_task: 1
    max_tasks: 10
    params:
      suite: libero_spatial
      seed: 7
      num_steps_wait: 10
      # max_steps: 400

