# LIBERO Goal suite (10 tasks × 50 episodes)
server:
  url: "ws://localhost:8002"
  timeout: 120.0

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest
  gpus: "2,3,5"

output_dir: "./results_goal"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    subname: libero_goal
    episodes_per_task: 50
    params:
      suite: libero_goal
      seed: 7
      num_steps_wait: 10

