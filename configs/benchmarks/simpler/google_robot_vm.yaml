# Google Robot Fractal: Visual Matching (VM) only.
# Split from google_robot_all.yaml — server/docker/benchmark entries unchanged.
# Paper 4-task set: Pick Coke Can, Move Near, Open/Close Drawer, Place Apple.
# VM Place Apple is google_robot_place_apple_in_closed_top_drawer.
# pick_object is omitted.
# VM budget: 100 eps/task, except move_near=60 (only 60 init triplets).
server:
  url: ws://localhost:8004
  timeout: 120.0
docker:
  image: ghcr.io/allenai/vla-evaluation-harness/simpler-groot:latest
  gpus: 3,4,5
  env:
  - NVIDIA_DRIVER_CAPABILITIES=all
  volumes:
  - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro
output_dir: ./results_simpler_google_robot_vm
benchmarks:
- benchmark: vla_eval.benchmarks.simpler.benchmark:SimplerEnvBenchmark
  subname: pick_coke_can
  episodes_per_task: 100
  params:
    task_name: google_robot_pick_coke_can
- benchmark: vla_eval.benchmarks.simpler.benchmark:SimplerEnvBenchmark
  subname: move_near
  episodes_per_task: 60
  params:
    task_name: google_robot_move_near
- benchmark: vla_eval.benchmarks.simpler.benchmark:SimplerEnvBenchmark
  subname: open_drawer
  episodes_per_task: 100
  params:
    task_name: google_robot_open_drawer
- benchmark: vla_eval.benchmarks.simpler.benchmark:SimplerEnvBenchmark
  subname: close_drawer
  episodes_per_task: 100
  params:
    task_name: google_robot_close_drawer
- benchmark: vla_eval.benchmarks.simpler.benchmark:SimplerEnvBenchmark
  subname: place_apple_in_closed_top_drawer
  episodes_per_task: 100
  params:
    task_name: google_robot_place_apple_in_closed_top_drawer
