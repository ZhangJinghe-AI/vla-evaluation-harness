# Google Robot Fractal: VM + VA in one run (one checkpoint, port 8004).
# Paper 4-task set on both sides: Pick Coke Can, Move Near, Open/Close Drawer,
# Place Apple. VM Place Apple is google_robot_place_apple_in_closed_top_drawer.
# pick_object is omitted. VA Place Apple is put_in_drawer_va_* (already apple).
# VM: 50 eps/task. VA: full init grid per variant (pick 25, move_near 60,
# drawer 9, put_in 27) so pose coverage matches official VA — fair vs VM
# when both are reported as 4-task macro averages (not episode-weighted).
server:
  url: ws://localhost:8004
  timeout: 120.0
docker:
  image: ghcr.io/allenai/vla-evaluation-harness/simpler-groot:latest
  gpus: 0,1,4
  env:
  - NVIDIA_DRIVER_CAPABILITIES=all
  volumes:
  - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro
output_dir: ./results_simpler_google_robot_all
benchmarks:
- benchmark: vla_eval.benchmarks.simpler.benchmark:SimplerEnvBenchmark
  subname: pick_coke_can
  episodes_per_task: 50
  params:
    task_name: google_robot_pick_coke_can
- benchmark: vla_eval.benchmarks.simpler.benchmark:SimplerEnvBenchmark
  subname: move_near
  episodes_per_task: 50
  params:
    task_name: google_robot_move_near
- benchmark: vla_eval.benchmarks.simpler.benchmark:SimplerEnvBenchmark
  subname: open_drawer
  episodes_per_task: 50
  params:
    task_name: google_robot_open_drawer
- benchmark: vla_eval.benchmarks.simpler.benchmark:SimplerEnvBenchmark
  subname: close_drawer
  episodes_per_task: 50
  params:
    task_name: google_robot_close_drawer
- benchmark: vla_eval.benchmarks.simpler.benchmark:SimplerEnvBenchmark
  subname: place_apple_in_closed_top_drawer
  episodes_per_task: 50
  params:
    task_name: google_robot_place_apple_in_closed_top_drawer
- benchmark: vla_eval.benchmarks.simpler.benchmark:SimplerEnvBenchmark
  subname: pick_coke_can_va_horizontal_base
  episodes_per_task: 25
  params:
    task_name: google_robot_pick_horizontal_coke_can
    env_name: GraspSingleOpenedCokeCanInScene-v0
    scene_name: google_pick_coke_can_1_v4
    env_build_kwargs: &id001
      lr_switch: true
      robot: google_robot_static
      sim_freq: 513
      control_freq: 3
    init_config: &id002
      robot_x:
      - 0.35
      - 0.35
      - 1
      robot_y:
      - 0.2
      - 0.2
      - 1
      obj_x:
      - -0.35
      - -0.12
      - 5
      obj_y:
      - -0.02
      - 0.42
      - 5
- benchmark: vla_eval.benchmarks.simpler.benchmark:SimplerEnvBenchmark
